[package]
name = "ci-doctor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Classify CI failures from raw logs or JUnit XML and suggest the next step"
license = "MIT"
authors = ["Gachengoh Marugu"]
repository = "https://github.com/TyllerDaniel/ci-doctor"
keywords = ["ci", "junit", "testing", "flaky-tests", "devops"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
criterion = "0.8.2"
